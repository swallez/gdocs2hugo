[package]
authors = ["Sylvain Wallez <sylvain@bluxte.net>"]
edition = "2021"
name = "gdocs2hugo"
version = "0.1.0"

[dependencies]
# Base stuff
anyhow = { version = "1", features = ["backtrace"] }
chrono = { version = "0.4", features = ["serde"] }
indoc = "2"
itertools = "0.10"
lazy_static = "1.4"
maplit = "1"
regex = "1"
lazy-regex = "3"
clap = { version="3", features = ["derive"] }
rayon = "1"
backtrace-on-stack-overflow = "0.3"

# Serde and formats
serde = {version = "1" }
serde_derive = {version = "1" }
csv = "1"
serde_yaml = "0.9"
serde_json = "1"

# HTML and CSS parsing
html5ever = "0.26"
markup5ever = "0.11"

scraper = "0.16"
tendril = "0.4"

glob = "0.3"

# HTTP
reqwest = {version = "0.11", features = ["blocking"] }
url = "2"
hyper014 = { package = "hyper", version = "0.14", features = ["client"] }
hyper-rustls = {version = "0.24", features = ["http1", "http2"] }
tokio = { version = "*", features = ["rt-multi-thread"] }
bytes = "1"
mime_guess = "2"
http = "0.2"

# Used for images
image = "0.24"

## Google docs
google-docs1 = "5"
google-drive3 = "5"
google-sheets4 = "5"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
testresult = "0.3.0"
